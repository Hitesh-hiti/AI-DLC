services:
  influxdb:
    image: influxdb:2.7
    container_name: kiro-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - kiro_influxdb:/var/lib/influxdb2
      - kiro_influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: kiro-admin-2026
      DOCKER_INFLUXDB_INIT_ORG: kiro
      DOCKER_INFLUXDB_INIT_BUCKET: usage
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kiro-local-token-2026

volumes:
  kiro_influxdb:
  kiro_influxdb_config: