
services:
  backend:
    image: hitesh9/travelplatform-backend:latest
    container_name: travelplatform-backend
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      NODE_ENV: production
      PORT: 8081
      HOST: 0.0.0.0
    volumes:
      - backend-data:/app/data
    networks:
      - application-network

  frontend:
    image: hitesh9/travelplatform-frontend:latest
    container_name: travelplatform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - application-network

networks:
  application-network:
    driver: bridge

volumes:
  backend-data:
